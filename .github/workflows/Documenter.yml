# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Documenter

on:
  # Runs on pushes targeting the `main` branch. Change this to `main` if you're
  # using the `main` branch as the default branch.
  push:
    branches:
    - main
    tags: ['*']
  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

# One docs run per ref. A new push to a pull request replaces the run already
# going for that ref. Pushes to main are not cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job. The Metal and FLUXNET tutorials run in the other jobs.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed if lastUpdated is set to true
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: |
          julia --project=docs -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(url = "https://github.com/LuxDL/LuxZarr.jl.git")
          '
      # julia-docdeploy turns on --code-coverage only while instantiating.
      # The process that runs docs/make.jl has to carry the flag, because that
      # is the run whose line hits we upload.
      - name: Build and deploy docs
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate("docs-logger-env"; shared=true)
            Pkg.add(Pkg.PackageSpec(name="GitHubActions", version="0.1"))
          '
          julia --color=yes --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --color=yes --code-coverage=user --project=docs/ -e '
            @eval Module() begin
              push!(LOAD_PATH, "@docs-logger-env")
              import Logging, GitHubActions
              Logging.global_logger(GitHubActions.GitHubActionsLogger())
              pop!(LOAD_PATH)
            end
            include("docs/make.jl")
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          GKSwstype: "100" # for Plots.jl plots (if you have them)
          JULIA_DEBUG: "Documenter"
          DATADEPS_ALWAYS_ACCEPT: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: documentation
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}

  # Runs the FLUXNET tutorial. make.jl only publishes that page's source.
  fluxnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: |
          julia --project=docs/fluxnet -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(url = "https://github.com/LuxDL/LuxZarr.jl.git")
            Pkg.instantiate()
          '
      - name: Run the FLUXNET tutorial
        run: |
          julia --color=yes --code-coverage=user --project=docs/fluxnet docs/literate/research/fluxnet_partitioning.jl
        env:
          DATADEPS_ALWAYS_ACCEPT: true
          GKSwstype: "100"
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: documentation
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}

  # Runs the Metal tutorial. make.jl only publishes that page's source.
  gpu:
    runs-on: macOS-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Install unregistered dependencies
        run: |
          julia --project=docs/gpu -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.add(url = "https://github.com/LuxDL/LuxZarr.jl.git")
            Pkg.instantiate()
          '
      - name: Run the Metal tutorial
        run: |
          julia --color=yes --code-coverage=user --project=docs/gpu docs/literate/tutorials/synthetic_respiration_gpu.jl
        env:
          DATADEPS_ALWAYS_ACCEPT: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: documentation
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
