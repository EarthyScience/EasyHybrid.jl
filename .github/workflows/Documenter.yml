# Sample workflow for building and deploying a VitePress site to GitHub Pages
#
name: Documenter

on:
  # Runs on pushes targeting the `main` branch. Change this to `main` if you're
  # using the `main` branch as the default branch.
  push:
    branches:
    - main
    tags: ['*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write
  statuses: write

# One docs run per ref. A new push to a pull request replaces the run already
# going for that ref. Pushes to main are not cancelled.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One runner per executable page. The build job only publishes the site.
  pages:
    name: ${{ matrix.name }}
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-docs')"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: get_started
            os: ubuntu-latest
            project: docs
            page: docs/src/get_started.md
          - name: exponential_res
            os: ubuntu-latest
            project: docs
            page: docs/src/tutorials/exponential_res.md
          - name: hyperparameter_tuning
            os: ubuntu-latest
            project: docs
            page: docs/src/tutorials/hyperparameter_tuning.md
          - name: transformer_math
            os: ubuntu-latest
            project: docs
            page: docs/src/transformer_math.md
          - name: losses
            os: ubuntu-latest
            project: docs
            page: docs/src/tutorials/losses.md
          - name: building_models
            os: ubuntu-latest
            project: docs
            page: docs/literate/tutorials/building_models.jl
          - name: sequence
            os: ubuntu-latest
            project: docs
            page: docs/literate/tutorials/example_synthetic_sequence.jl
          - name: folds
            os: ubuntu-latest
            project: docs
            page: docs/literate/tutorials/folds.jl
          - name: synthetic_respiration
            os: ubuntu-latest
            project: docs
            page: docs/literate/research/synthetic_respiration.jl
          - name: fluxnet
            os: ubuntu-latest
            project: docs/fluxnet
            page: docs/literate/research/fluxnet_partitioning.jl
          - name: gpu
            os: macOS-latest
            project: docs/gpu
            page: docs/literate/tutorials/synthetic_respiration_gpu.jl
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      - name: Develop EasyHybrid and instantiate
        run: |
          julia --project=${{ matrix.project }} -e '
            using Pkg
            Pkg.develop(PackageSpec(path=pwd()))
            Pkg.instantiate()
          '
      - name: Run documentation page
        run: |
          julia --color=yes --code-coverage=user --project=${{ matrix.project }} docs/runpage.jl ${{ matrix.page }}
        env:
          DATADEPS_ALWAYS_ACCEPT: true
          GKSwstype: "100"
      - name: Collect training videos
        if: always()
        run: |
          mkdir -p docs/media
          find docs -path '*/build/*.mp4' -exec cp {} docs/media/ \;
      - name: Upload training videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-media-${{ matrix.name }}
          path: docs/media
          if-no-files-found: ignore
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: documentation
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}

  # Publishes the site and executes the example blocks.
  build:
    if: "!contains(github.event.pull_request.labels.*.name, 'skip-docs')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed if lastUpdated is set to true
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
      - name: Load Julia packages from cache
        id: julia-cache
        uses: julia-actions/cache@v2
      # julia-docdeploy turns on --code-coverage only while instantiating.
      # The process that runs docs/make.jl has to carry the flag, because that
      # is the run whose line hits we upload.
      - name: Build and deploy docs
        run: |
          julia --color=yes -e '
            using Pkg
            Pkg.activate("docs-logger-env"; shared=true)
            Pkg.add(Pkg.PackageSpec(name="GitHubActions", version="0.1"))
          '
          julia --color=yes --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
          julia --color=yes --code-coverage=user --project=docs/ -e '
            @eval Module() begin
              push!(LOAD_PATH, "@docs-logger-env")
              import Logging, GitHubActions
              Logging.global_logger(GitHubActions.GitHubActionsLogger())
              pop!(LOAD_PATH)
            end
            include("docs/make.jl")
          '
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # For authentication with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
          GKSwstype: "100" # for Plots.jl plots (if you have them)
          JULIA_DEBUG: "Documenter"
          DATADEPS_ALWAYS_ACCEPT: true
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          flags: documentation
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Save Julia depot cache on cancel or failure
        id: julia-cache-save
        if: cancelled() || failure()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.julia-cache.outputs.cache-paths }}
          key: ${{ steps.julia-cache.outputs.cache-key }}
